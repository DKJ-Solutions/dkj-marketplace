# The merge-on-green runner: finishes a ship whose session is gone -- issue #2319.
#
# WHERE A DECISION IS ARGUED: DIRECTLY ABOVE THE KEY IT DECIDES, the convention ci.yml's own banner
# states and the reason it states it -- git cannot merge two appends at one anchor, so a file that
# collects its prose in one block makes every pair of branches touching it conflict by construction.
name: Merge on green

# THE JOB TOKEN ONLY READS, AND THE MERGE IS NOT ITS WORK. The picker lists pull requests and their
# required checks; nothing here writes with this token. Declaring a permissions block at all sets every
# unlisted scope to none, which is the point -- the write half arrives as FOLD_PUSH_TOKEN, on the one
# step that needs it, and never through this block. The one exception is the redispatch job at the
# bottom (#4198), whose own block adds actions: write for `gh workflow run` and for nothing else.
#
# checks: AND statuses: ARE THE PICKER'S, NOT A WIDENING (#3491). It reads the required checks with
# `gh pr checks --required`. This repo is public, so check runs read without them; a private consumer's
# do not, and its picker then never picks anything while every run concludes success.
#
# AND actions: IS THE SCOPE THAT ACTUALLY MISSED (#3619). gh resolves the workflow run behind every check
# run, so with actions at none the read still fails ("Resource not accessible by integration") after
# checks: and statuses: were added. Read-only, like the rest of this block.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

# THREE TRIGGERS FOR ONE SWEEP, AND THE SWEEP IGNORES WHICH OF THEM WOKE IT. workflow_run gives
# immediacy; the schedule is what makes the mechanism durable, because #2319's own incident was
# repaired with `gh run rerun --failed` and whether a partial re-run re-emits workflow_run is not a
# contract worth resting this on; workflow_dispatch is the hand valve for when a person wants the
# sweep now. None of the three is read for WHICH pull request is owed a merge -- pick-merge-on-green.ps1
# reads the tracker instead, so a trigger that fires late, twice or not at all costs at most one cycle.
#
# workflow_run RUNS THE VERSION OF THIS FILE ON THE DEFAULT BRANCH, always, whatever branch the CI run
# it reacts to was for. So a change here is inert until it is merged -- this workflow cannot be proved
# on its own pull request, and the first live proof is its own first sweep after the merge.
#
# AND workflow_run IS THE TRIGGER THAT RUNS WITH SECRETS FOR A PULL REQUEST FROM A FORK, which is the
# standard hazard of it and the reason this job reads NOTHING out of the event. Everything it acts on
# comes from the tracker: an open pull request carrying a label only ship-pr writes, whose head is a
# branch of THIS repository (pick-merge-on-green.ps1 refuses a cross-repository one outright). A fork's
# pull request can therefore start this job and can reach none of its decisions -- it cannot set the
# label, and its head ref is not a branch here. Neither guard is load-bearing alone, which is why both
# are asked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # EVERY 30 MINUTES, AND THE NUMBER IS A RUNNER-CONTENTION DECISION RATHER THAN A LATENCY ONE.
    # workflow_run already covers the ordinary path the moment CI finishes, so this only has to catch
    # what that trigger misses -- a partial re-run, a dropped event -- and every sweep is a job on a repo
    # that has MEASURED runner-queue contention (#2296: a shard sitting 38 minutes in_progress; #2317: the
    # gate cost of waiting). 48 extra jobs a day is a backstop; 96
    # would be this runner competing with the CI it exists to react to.
    #
    # AND GITHUB DOES NOT HONOUR IT HERE (#3807): the scheduled runs of November 1-4, 2026 were created
    # every 4 to 8 hours, not every 30 minutes -- GitHub drops and delays scheduled runs under load. So
    # this is a backstop for a lost event, never a latency guarantee, and the one gap it was quietly
    # covering -- the settle window refusing the LAST green pull request's only workflow_run wake -- is
    # closed in the pick step instead (-WaitForSettleSeconds).
    #
    # THIS REPO STAYS AT THIS CADENCE; adopt-ci-floor.ps1's consumer template places it sparser instead,
    # every 3 hours (issue #2487) -- this repo is public, so a standard-runner job costs nothing and a
    # denser cron costs nothing either, while a private consumer is billed per scheduled job start whether
    # or not anything is owed a merge -- so on a private consumer the latency is worth giving up:
    # half-hourly is 48 billed jobs/day, every 3 hours is 8.
    - cron: '*/30 * * * *'
  # THE HAND VALVE, AND SINCE #4198 ALSO THE RUNNER'S OWN WAKE: the redispatch job at the bottom of this
  # file dispatches this workflow again after a held merge, carrying the retry counter as this input. A
  # person dispatching by hand leaves it at 0.
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry counter after a held merge (#4198); leave at 0 when dispatching by hand.'
        required: false
        default: '0'

# ONE SWEEP AT A TIME, REPO-WIDE, AND NOT CANCELLED. cancel-in-progress: false because this job MERGES
# and FOLDS: dropping an in-flight run is the silent skip the whole family of merger-independent runners
# exists to close (fold-on-merge.yml, #1493). The group is a constant rather than keyed on a ref, which
# is the opposite choice from the two push-triggered runners and for a reason they do not have: those
# answer a question about one push, while this one answers a question about the whole tracker, so two
# concurrent sweeps would race to ship the SAME pull request. GitHub keeps at most one run pending per
# group, and dropping a duplicate pending sweep costs nothing because a sweep is idempotent by
# construction -- it re-reads the tracker when it starts.
concurrency:
  group: merge-on-green
  cancel-in-progress: false

jobs:
  # THREE JOBS BEFORE THE REDISPATCH, AND THE SPLIT IS A RUNNER BOUNDARY, NOT TIDINESS (issue #4440). The
  # merged-result job below runs scripts out of a tree built from the PR head, and a step in the SAME job
  # as the ship could rewrite 'trusted-main' on the shared runner disk before the token-bearing step runs
  # it. A separate job is a separate virtual machine, so the pick is lifted into its own job too, and both
  # later jobs read it through needs:.
  pick:
    runs-on: ubuntu-latest
    # 20 MINUTES: the picker's settle wait (at most 660s, below) plus its one-minute re-read, with room.
    timeout-minutes: 20
    outputs:
      picked: ${{ steps.pick.outputs.picked }}
      pr: ${{ steps.pick.outputs.pr }}
      branch: ${{ steps.pick.outputs.branch }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # The trunk, read-only, for the picker script; the ship job below checks it out again for itself.
      - name: Checkout the trusted trunk for the picker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Make `powershell` resolve to pwsh
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      # THE PICKER READS WITH THE JOB-SCOPED TOKEN, NOT WITH THE PAT. It only lists pull requests and
      # their checks, and an hour-lived token that expires with the run is the right credential for a
      # read -- keeping the standing one out of every step that does not need it. RUN FROM 'trusted-main'
      # (working-directory), which is where this script's file now lives on disk -- the workspace ROOT no
      # longer holds a checkout at all, so a bare relative path here would resolve to nothing.
      #
      # -WaitForSettleSeconds 660 (#3807): when nothing is eligible ONLY because the settle window refused
      # it, the picker waits out the remainder -- at most the 10-minute window plus a margin -- and judges
      # the tracker once more. That wake is this run's own, because for the last pull request to go green
      # no later CI run will come to wake the sweep, and the schedule above arrives hours late. While it
      # waits it holds the concurrency group; a CI completion meanwhile queues one pending sweep, which is
      # idempotent. The picker's own one-minute re-read on mergeable UNKNOWN (#4427, on by default) comes
      # first, so 12 minutes fits this job's cap, and two forward laps plus the ship fit the ship job's.
      # The consumer template passes the same cap (#3809): there the wait is billed, a cost accepted for it.
      - name: Is any armed pull request owed a merge?
        id: pick
        shell: pwsh
        working-directory: trusted-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/pick-merge-on-green.ps1 -WaitForSettleSeconds 660
          exit $LASTEXITCODE

  # THE #4432 CROSS-FILE CHECKS, RUN WHERE NO TOKEN IS (issue #4440, the owner's option (a)). A docs-only
  # pull request that shares no file with what 'main' gained since its certificate keeps that certificate
  # without a ~10 minute forward lap, once check-plugin-integrity and check-always-on-budget pass on 'main'
  # merged into its head. A session runs those checks itself; the ship job below must not, because it holds
  # FOLD_PUSH_TOKEN and #2452 keeps the merged tree's code out of that process. So this job runs them, holds
  # no secret and only a contents: read token, and hands over three strings: the verdict, and the head and
  # 'main' SHAs it was reached on. ship-pr (Test-MergedResultVerdict) accepts a pass only for the exact head
  # it is merging and the exact 'main' tip it judged, and only for a PR its OWN trusted code judged
  # docs-only and disjoint. So the most a forged verdict can buy is skipping one lap for such a PR, whose
  # required check has already passed on its own head.
  #
  # IT RUNS NOTHING THE PR WROTE AS CODE. A PR whose diff names any path that is not .md is answered 'skip'
  # before anything is merged or run, so the scripts executed here are always the trunk's own, beside the
  # PR's Markdown. WINDOWS, LIKE ci.yml's LINT LEG, because that is where check-plugin-integrity is proven.
  merged-result:
    needs: pick
    if: ${{ needs.pick.outputs.picked == 'true' }}
    runs-on: windows-latest
    # 20 MINUTES: the lint leg measures 1.5 minutes and the budget check under one; a wedge detector.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      head: ${{ steps.check.outputs.head }}
      main: ${{ steps.check.outputs.main }}
    steps:
      # THE PICKED COMMIT, NOT THE BRANCH NAME, and the full history, so 'origin/main' and the merge base
      # are both here.
      - name: Checkout the picked head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          path: merged
          fetch-depth: 0
          persist-credentials: false

      # EVERY EXIT WRITES A VERDICT, and only 'pass' discounts anything; 'skip' and 'fail' leave the lap.
      # The picked SHA arrives through env:, never through ${{ }} inside run:.
      - name: Merge main in and run the cross-file checks
        id: check
        shell: powershell
        working-directory: merged
        env:
          PICKED_SHA: ${{ needs.pick.outputs.sha }}
        run: |
          $main = "$(git rev-parse origin/main)".Trim()
          function Out-Verdict([string]$Verdict, [string]$Why) {
            Write-Host "merged-result: $Verdict -- $Why"
            # NOT Out-File -Encoding utf8: under Windows PowerShell that writes a BOM, and the first key would
            # read as '<BOM>verdict', so every pass would arrive as no verdict at all.
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "verdict=$Verdict`nhead=$env:PICKED_SHA`nmain=$main`n", (New-Object System.Text.UTF8Encoding $false))
            exit 0
          }
          if ("$(git rev-parse HEAD)".Trim() -ne $env:PICKED_SHA) { Out-Verdict 'skip' 'the checkout is not the picked commit' }
          $base = "$(git merge-base origin/main HEAD)".Trim()
          if ($LASTEXITCODE -ne 0 -or -not $base) { Out-Verdict 'skip' 'no merge base with origin/main' }
          # --raw, so the MODES are read too: a symlink (120000) or a submodule (160000) named *.md is not a
          # Markdown file, and refusing it keeps "only the trunk's scripts run here" true by construction.
          $status = @(git -c core.quotePath=false diff --raw -M $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $status.Count -eq 0) { Out-Verdict 'skip' 'the PR diff could not be read' }
          foreach ($line in $status) {
            $meta = @((($line -split "`t")[0]) -split ' ')
            if ($meta.Count -lt 2 -or $meta[0] -match '120000|160000' -or $meta[1] -match '^(120000|160000)$') { Out-Verdict 'skip' 'the PR changes a symlink or a submodule' }
            foreach ($p in @(($line -split "`t") | Select-Object -Skip 1)) {
              if (-not $p.EndsWith('.md', [System.StringComparison]::OrdinalIgnoreCase)) { Out-Verdict 'skip' 'the PR changes a path that is not .md' }
            }
          }
          git -c user.name=merge-on-green -c user.email=merge-on-green@localhost -c commit.gpgsign=false merge --no-edit --quiet origin/main
          if ($LASTEXITCODE -ne 0) { Out-Verdict 'fail' 'origin/main does not merge cleanly into the PR head' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-plugin-integrity.ps1
          if ($LASTEXITCODE -ne 0) { Out-Verdict 'fail' 'check-plugin-integrity did not pass on the merged result' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-always-on-budget.ps1 -RootOverride (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { Out-Verdict 'fail' 'check-always-on-budget did not pass on the merged result' }
          Out-Verdict 'pass' 'both cross-file checks passed on the merged result'

  merge-on-green:
    # AFTER BOTH, AND NOT HELD BY THE SECOND: a merged-result job that failed, timed out or was never
    # needed hands over no 'pass', and ship-pr then takes the forward lap exactly as before #4440.
    needs: [pick, merged-result]
    if: ${{ !cancelled() && needs.pick.result == 'success' && needs.pick.outputs.picked == 'true' }}
    # LINUX, UNDER PWSH 7 (issue #2616), the last runner to follow fold-on-merge, verify-resolved and
    # repo-settings (#2488). It was held back because it drives ship-pr's whole merge path, and a
    # workflow_run runner cannot be proved on its own PR: it runs the DEFAULT BRANCH's copy of this file.
    # So the proof comes in two halves. Before the merge, ci.yml's Linux leg runs the suites that pin
    # ship-pr's merge path under pwsh on ubuntu-latest. After it, the first sweep that ships an armed PR
    # is the live run, and a workflow_dispatch run with nothing armed exercises the pick step on its own.
    runs-on: ubuntu-latest
    # held IS THE SHIP STEP'S ANSWER TO "did ship-pr hand the merge back after a 5xx?" (#4198), read by the
    # redispatch job below. It is written before that step exits non-zero, and GitHub records a step's
    # outputs whatever its conclusion.
    outputs:
      held: ${{ steps.ship.outputs.held }}
      redispatch: ${{ steps.plan.outputs.redispatch }}
      next: ${{ steps.plan.outputs.next }}
      delay: ${{ steps.plan.outputs.delay }}
      workflow: ${{ steps.plan.outputs.workflow }}
      ref: ${{ steps.plan.outputs.ref }}
      reason: ${{ steps.plan.outputs.reason }}
    # 45 MINUTES, WHICH IS LONGER THAN EVERY OTHER JOB HERE BECAUSE THIS ONE WAITS ON CI ON PURPOSE.
    # ship-pr's step 3b may bring a stale branch up to date and re-certify it, up to -MaxForwardLaps
    # times, and each lap is a full CI cycle (310-461s over the last 40 paired runs, per ci.yml's own
    # measurement). Two laps plus the ship itself fits inside 45 with room; the cap is still a wedge
    # detector rather than a budget, in the sense ci.yml's banner gives it -- the alternative is
    # GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      # TWO SEPARATE CHECKOUTS -- TWO SEPARATE .git DIRECTORIES -- NOT ONE CHECKOUT SWITCHED IN PLACE
      # (issue #2437, closing #2338's exposure). Until this branch, this job checked 'main' out ONCE with
      # FOLD_PUSH_TOKEN persisted into its workspace git config, then ran `git checkout <branch>` IN THAT
      # SAME WORKSPACE -- so ship-pr.ps1 and everything it dot-sources ran as the BRANCH's own PowerShell,
      # in a tree carrying a standing write credential that bypasses the main ruleset. A pull request
      # touching scripts/, .github/, .workflow-scripts/ or a plugin's scripts/ could therefore never be
      # swept (Get-MergeOnGreenExecutedPathHit refused it), which was ~80% of merged PRs here (#2436).
      #
      # NOW: 'trusted-main' is a checkout of the TRUNK, and 'pr-branch' (added further down; the pick
      # job above has already chosen the pull request) is a checkout of the PR's OWN head -- two independent clones,
      # two independent git configs, sharing nothing but the same runner disk. ship-pr.ps1 -- and every
      # sibling lib it loads via $PSScriptRoot -- runs FROM 'trusted-main' (see the Ship it step), so the
      # code doing the sweeping is never the branch's own copy, whatever the branch's diff touches.
      #
      # PERSIST-CREDENTIALS IS DELIBERATELY FALSE HERE TOO, unlike the single checkout this replaces.
      # Neither tree carries a STATIC, on-disk credential: the Ship it step below supplies an EPHEMERAL,
      # environment-only git credential (built from FOLD_PUSH_TOKEN, never written to either tree's
      # .git/config) for the one operation that needs to push -- the fold's commit to 'main'. See that
      # step for why an environment-only credential rather than actions/checkout's own persisted one, and
      # for the residual exposure that choice still carries (GH_TOKEN in the step's process environment,
      # inherited by every child process of it, same as every other step in this file already accepts for
      # its `gh` calls). That process does read PR-controlled DATA (the branch document, the PR body) as
      # text, and a job split to keep the token away from THAT DATA was measured and refused on #2452 (the
      # pick and merged-result jobs above are a different split: they keep CODE away from it, #4440); what
      # guards it instead is scripts/tests/trusted-tree-seam.tests.ps1, which refuses the enumerated
      # string-to-code primitives (its header lists them) in the code this step runs, child scripts
      # included -- a syntactic guard against one being ADDED, since that code comes from trusted-main.
      # Read as unresolved without a live run: this workflow cannot be proved on its own
      # pull request (see workflow_run's own comment above), so this exact mechanism is proven only by its
      # first live sweep after this merges.
      #
      # NO TOKEN: INPUT AT ALL ON THIS CHECKOUT. The default (the job-scoped GITHUB_TOKEN) is a READ of a
      # PUBLIC repository -- more than sufficient, and it is the narrower, hour-lived credential rather
      # than the 366-day standing one, kept out of a step that does not need it.
      #
      # PINNED TO A COMMIT SHA, same reasoning as the single checkout this replaces carried: a mutable tag
      # on a step in a job whose LATER step handles a 366-day standing write token could retag its way
      # into exfiltrating it, even though THIS particular checkout carries no token of its own.
      - name: Checkout the trusted trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      # THE SHIM (issue #2488): ship-pr launches open-pr, the fold and verify-resolved-issues as children
      # by the literal name `powershell`, and ubuntu-latest has only `pwsh`. One symlink resolves all of
      # them. It runs before the first pwsh step, and before any step that holds FOLD_PUSH_TOKEN.
      - name: Make `powershell` resolve to pwsh
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      # THE PR'S OWN HEAD, IN ITS OWN TREE -- carrying no token, and persist-credentials: false so
      # nothing is written to ITS .git/config either. ref: is the picker's own output, not typed by a
      # session -- pick-merge-on-green.ps1 has already refused any branch name outside a plain charset
      # (the same guard the old `git checkout $env:SHIP_BRANCH` line relied on), and a `with:` input is
      # passed to the checkout action as a parameter rather than concatenated into a shell string, so this
      # is not the ${{ }}-in-run: hazard the Ship it step's own comment warns about.
      #
      # SHALLOW (the default): the SHA check just below refuses on a moved head before anything past this
      # tree is trusted, and the Ship it step deepens THIS checkout, not this one's ref resolution.
      - name: Checkout the picked pull request's branch
        if: ${{ needs.pick.outputs.picked == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.branch }}
          path: pr-branch
          persist-credentials: false

      # THE SHIP IS ship-pr.ps1 ITSELF, NOT A SECOND IMPLEMENTATION OF ITS GATES. #2319 describes a
      # runner that merges "only when the required check is green on the exact head and the staleness
      # count is zero"; that second predicate is step 3b, and the step-list gate and the DEPLOY lock are
      # two more this job would otherwise have to restate. Running the script is what keeps one
      # implementation of each -- and it means every later repair to ship-pr reaches this runner with no
      # edit here at all. It also folds (step 5) and verifies the resolves (step 6), so this job leaves
      # the trunk in exactly the state a live session would have left it in.
      #
      # RUN FROM 'trusted-main' (-TrustedRoot, issue #2437): the ONE thing $PSScriptRoot alone cannot
      # give ship-pr.ps1 is the two repo-owned seams (scripts/repo-config.ps1, scripts/lib/branch-info.ps1)
      # it and open-pr.ps1 read from $repoRoot -- see ship-pr.ps1's own .PARAMETER TrustedRoot for the
      # full reasoning and its named limitation. CLAUDE_PROJECT_DIR points $repoRoot itself at 'pr-branch'
      # -- the checked-out branch -- so the merge, the step-list gate, the DEPLOY lock and the push all
      # still read and act on THAT tree's own commit, exactly as a live session would.
      #
      # GH_TOKEN IS THE PAT HERE, AND THAT IS THE WHOLE REASON THE SECRET NEEDS 'Pull requests: write'
      # ADDED TO IT. A push CAUSED BY the job-scoped GITHUB_TOKEN starts no workflow runs -- this tree
      # already records that in verify-resolved.yml's header -- so a GITHUB_TOKEN merge would land the
      # pull request and silence ci.yml on the trunk, fold-on-merge.yml and verify-resolved.yml all
      # three. That is the unobserved-merge state those runners exist to close, reintroduced by the
      # mechanism meant to help. Until the scope is added this step fails with a 403 on the merge, which
      # is loud and says so; it can never merge without folding.
      #
      # THE BRANCH ARRIVES THROUGH env:, NOT THROUGH ${{ }} INSIDE run:. Interpolating an expression
      # into a shell body substitutes it as TEXT before the shell parses the line, and a head ref is
      # chosen by whoever opened the pull request -- the one genuinely attacker-controlled value in this
      # file. pick-merge-on-green.ps1 has already refused any name outside a plain charset; this is the
      # second half of that same guard, and neither is load-bearing alone.
      - name: Ship it
        id: ship
        if: ${{ needs.pick.outputs.picked == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FOLD_PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}/pr-branch
          SHIP_BRANCH: ${{ needs.pick.outputs.branch }}
          SHIP_PR: ${{ needs.pick.outputs.pr }}
          SHIP_SHA: ${{ needs.pick.outputs.sha }}
          # THE merged-result JOB'S VERDICT (issue #4440), read by ship-pr's step 3b only under -TrustedRoot
          # and only for the head and 'main' tip it names. Empty when that job was skipped or failed.
          DKJ_MERGED_RESULT_VERDICT: ${{ needs.merged-result.outputs.verdict }}
          DKJ_MERGED_RESULT_HEAD: ${{ needs.merged-result.outputs.head }}
          DKJ_MERGED_RESULT_MAIN: ${{ needs.merged-result.outputs.main }}
        run: |
          # Commit-metadata identity only -- who authored ship-pr's fold commit. It is independent of the
          # push credential set up below: a ruleset bypass is checked against the PUSHING token's identity,
          # not against the commit author. Same pair, same reason, as fold-on-merge.yml sets. Set in
          # BOTH trees: 'trusted-main' commits the fold, and open-pr.ps1 commits a dirty branch document
          # in 'pr-branch' (issue #2602). The two checkouts share no .git/config, and a hosted runner has
          # no global identity -- the consumer template sets the same pair in both (#2449).
          foreach ($tree in @('trusted-main', 'pr-branch')) {
            git -C $tree config user.name "github-actions[bot]"
            git -C $tree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          # THE EPHEMERAL PUSH CREDENTIAL (issue #2437, condition (d)). Neither checkout above persisted
          # FOLD_PUSH_TOKEN to disk (both used persist-credentials: false), so as of this line NEITHER
          # 'trusted-main' NOR 'pr-branch' can push anything -- and both need to be able to: 'pr-branch'
          # because open-pr.ps1's own step 1 pushes the branch (a no-op push here, since the sweep only
          # picked an already-open, already-current pull request, but `git push` still negotiates with the
          # remote and GitHub's receive-pack endpoint requires write authorisation for that negotiation
          # whether or not a ref actually moves), and 'trusted-main' because the fold's own commit has to
          # reach 'main' past its ruleset.
          #
          # git's GIT_CONFIG_KEY_n/GIT_CONFIG_VALUE_n/GIT_CONFIG_COUNT environment triplet (documented git
          # behaviour since 2.31) overlays config for every git process that inherits this environment --
          # which every git call below is, along with everything ship-pr.ps1 and open-pr.ps1 spawn as
          # children -- WITHOUT WRITING ANYTHING TO A .git/config FILE IN EITHER TREE. This is the same
          # 'AUTHORIZATION: basic <token>' header actions/checkout's own persist-credentials would write to
          # disk, supplied here as process memory instead: it dies with this step, in neither tree's
          # history, and 'gh' calls already accept the equivalent exposure through GH_TOKEN above.
          #
          # THIS IS A DELIBERATE DEPARTURE FROM Sebastian #23's OWN WORDING on #2437 ("token-bearing
          # checkout only for the trusted main tree"), NAMED HERE RATHER THAN SILENTLY SUBSTITUTED: his
          # design still leaves the raw token sitting in 'trusted-main's .git/config on disk for the
          # step's duration (residual exposure #3 in his own review). One credential, applied the same
          # way to both trees, removes that residue everywhere rather than only in the tree his own
          # wording named -- but it is a live judgement call, not something this branch could get signed
          # off before building, and it is exactly the kind of choice that needs his eyes before it ships
          # rather than after.
          $basicAuth = [Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basicAuth"

          # DEEPEN 'pr-branch', AND WIDEN ITS REFSPEC BEFORE DEEPENING. actions/checkout with a `ref:`
          # narrows remote.origin.fetch to that one branch, so an --unshallow alone would deepen the
          # branch and still not know 'main' -- which ship-pr's step 3b needs, walking 'main' first-parent
          # history since the certifying run's timestamp. A shallow clone silently truncates that walk,
          # the one direction a staleness gate must not err in. 'trusted-main' does NOT need this: the
          # fold's own fetch + ff-only merge (inside ship-pr.ps1) extends it exactly as far as 'origin/main'
          # has moved, which needs no prior depth at all.
          git -C pr-branch remote set-branches origin '*'
          git -C pr-branch fetch --unshallow --quiet origin
          if ($LASTEXITCODE -ne 0) {
            Write-Error "could not deepen the branch checkout -- ship-pr's staleness walk would be unsound, so nothing was merged."
            exit 1
          }

          # THE COMMIT THIS RUN ACTS ON HAS TO BE THE ONE THE PICKER JUDGED -- issue #2338, unchanged by
          # #2437's restructure. checkout's own ref: resolved the branch NAME to whatever it pointed at
          # when that step ran, a moment after the picker's own read; a push landing in between would
          # reach here unjudged were it not for this line. A mismatch stops the job; the next sweep judges
          # the new head.
          $head = (git -C pr-branch rev-parse HEAD).Trim()
          if ($head -ne $env:SHIP_SHA) {
            Write-Error "PR #$($env:SHIP_PR)'s head moved after the pick ($($env:SHIP_SHA) -> $head) -- nothing was run or merged; the next sweep judges the new head."
            exit 1
          }

          # -TrustedRoot: ship-pr.ps1 (and, forwarded, open-pr.ps1) load their two repo-owned seams from
          # 'trusted-main' instead of from 'pr-branch' -- see that parameter's own doc for what this buys
          # and its named limitation. -SkipLint -SkipTests ARE STILL PASSED EXPLICITLY, even though
          # -TrustedRoot now forces them structurally on its own (issue #2437, condition (c)): ship-pr's
          # step 1 calls open-pr.ps1 even for an already-open pull request -- it skips only the
          # `gh pr create` and still runs the gates -- so omitting them would have cost ~43 minutes
          # re-running the whole local suite pool before the structural force existed to catch it.
          # Skipping is not a shortcut past a gate: the sweep only picked this pull request BECAUSE the
          # required check is green on its own head, and that check IS this same gate, run on GitHub, on
          # this same commit -- it is the certificate, not a local copy, the merge is allowed on.
          Write-Host "merge-on-green: running ship-pr.ps1 (trusted-tree mode) on '$env:SHIP_BRANCH' for PR #$env:SHIP_PR"
          powershell -NoProfile -ExecutionPolicy Bypass -File trusted-main/scripts/release/ship-pr.ps1 -TrustedRoot (Join-Path $env:GITHUB_WORKSPACE 'trusted-main') -SkipLint -SkipTests
          $shipExit = $LASTEXITCODE
          # 75 IS ship-pr's HELD-MERGE REFUSAL (Get-MergeHeldExitCode, #4198): GitHub did not confirm the
          # merge after a 5xx or a held lock, and nothing else will wake the next sweep. The step still
          # fails, loudly; held=true only asks the redispatch job below to try again later.
          if ($shipExit -eq 75) { 'held=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          exit $shipExit


      # THE NEXT SWEEP IS PLANNED HERE, IN THE TRUSTED TREE, AND ONLY WOKEN BELOW (#4198). This step runs
      # the lib out of 'trusted-main', which this job already holds, so the redispatch job needs no
      # checkout of its own. It holds no token and runs no gh. The retry counter arrives through env:,
      # never through ${{ }} inside run:, because a dispatch input can be typed by hand, and the verdict
      # refuses anything that is not a small whole number.
      - name: Held merge -- plan the next sweep
        id: plan
        if: ${{ always() && steps.ship.outputs.held == 'true' }}
        shell: pwsh
        working-directory: trusted-main
        env:
          SWEEP_RETRY: ${{ inputs.retry }}
        run: |
          . ./scripts/lib/merge-on-green-lib.ps1
          $v = Get-MergeOnGreenRedispatchVerdict -Retry $env:SWEEP_RETRY -WorkflowRef $env:GITHUB_WORKFLOW_REF
          $lines = @(
            "redispatch=$($v.Redispatch.ToString().ToLowerInvariant())",
            "next=$($v.Next)", "delay=$($v.DelaySeconds)",
            "workflow=$($v.Workflow)", "ref=$($v.Ref)", "reason=$($v.Reason)"
          )
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # THE SWEEP WAKES ITSELF AFTER A HELD MERGE (issue #4198). After a 5xx on the merge, ship-pr hands the
  # pull request back armed and promises the sweep lands it -- but this run's CI wake is spent and the
  # schedule arrives hours late (#3807). Measured November 16, 2026: two sweeps got 502 on PR #4194's
  # merge 21 minutes apart, and both armed pull requests sat green for over an hour. So this job waits,
  # then dispatches this workflow again with a retry counter: 5, 10 and 15 minutes, at most three times
  # per held merge (Get-MergeOnGreenRedispatchVerdict). Past that it fails loudly and the pull request
  # waits for the next CI wake, as before. One merge that lands pushes to main, whose CI wakes the
  # sweep for every other armed pull request, so retrying the held one is enough.
  #
  # A JOB OF ITS OWN, BECAUSE IT IS THE ONLY ONE THAT WRITES WITH THE JOB TOKEN. actions: write is what
  # `gh workflow run` needs, and a job-level permissions block replaces the read-only top-level one for
  # this job alone -- the ship job keeps its read-only token. A workflow_dispatch made with GITHUB_TOKEN
  # does start a run, the documented exception to "a GITHUB_TOKEN event starts no workflow". The new run
  # queues behind this one in the merge-on-green concurrency group, so it cannot race the sweep.
  #
  # NO CHECKOUT AND NO SCRIPT FROM ANY TREE: everything it acts on is the plan step's output, computed in
  # the trusted trunk, and it reaches the shell through env:.
  redispatch:
    needs: merge-on-green
    if: ${{ always() && needs.merge-on-green.outputs.held == 'true' }}
    runs-on: ubuntu-latest
    # The longest wait is 15 minutes; the cap is a wedge detector above it.
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Wait, then wake the sweep again
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLAN_REDISPATCH: ${{ needs.merge-on-green.outputs.redispatch }}
          PLAN_NEXT: ${{ needs.merge-on-green.outputs.next }}
          PLAN_DELAY: ${{ needs.merge-on-green.outputs.delay }}
          PLAN_WORKFLOW: ${{ needs.merge-on-green.outputs.workflow }}
          PLAN_REF: ${{ needs.merge-on-green.outputs.ref }}
          PLAN_REASON: ${{ needs.merge-on-green.outputs.reason }}
        run: |
          if ($env:PLAN_REDISPATCH -ne 'true') {
            Write-Error "merge-on-green: not waking another sweep -- $env:PLAN_REASON."
            exit 1
          }
          Write-Host "merge-on-green: held merge, $env:PLAN_REASON -- waiting $($env:PLAN_DELAY)s, then dispatching $env:PLAN_WORKFLOW on $env:PLAN_REF."
          Start-Sleep -Seconds ([int]$env:PLAN_DELAY)
          gh workflow run $env:PLAN_WORKFLOW --ref $env:PLAN_REF -f "retry=$($env:PLAN_NEXT)"
          exit $LASTEXITCODE