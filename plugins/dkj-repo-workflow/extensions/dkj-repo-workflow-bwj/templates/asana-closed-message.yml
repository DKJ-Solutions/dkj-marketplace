# Placed from dkj-repo-workflow-bwj/templates/asana-closed-message.yml into
# .github/workflows/asana-closed-message.yml. The script it runs is NOT copied (#4351): it is fetched
# from DKJ-Solutions/dkj-marketplace at the pinned ref below, so a fix reaches this repo by moving that
# one line.
#
# Posts ONE comment on the Asana task a GitHub issue belongs to, when that issue closes as completed
# (the automation's header, the closed line, and the go-live block the shipping session left on the
# issue), closes as not planned under an awaiting-* label (the header and the on-hold line, #2902,
# #3494), or is reopened (the header and the reopened line). A completed close that carries a block
# also moves the card into the board's InReview section (#3248); a reopen moves it into InDevelopment and
# marks a completed task incomplete (#3562). It never completes a task or writes an Asana label. A
# completed close that carries NO block labels the GitHub issue 'result-owed' (#4267), so the result
# message the requester was promised is tracked where a session check reads it. The closed message (Dave, October 5, 2026, #2818) and the reopened
# message (October 6, #2854) are the two parts of the retired asana-mirror workflow that came back.
# The file keeps its
# closed-message name so a re-adopt replaces it rather than landing a second copy beside it. See
# dkj-repo-workflow-bwj/WORKFLOW-portable.md.
name: asana-closed-message

on:
  issues:
    # closed and reopened ONLY: no labeled, no schedule. The script decides on the close reason, and on
    # a close as not planned on the labels the issue carries at that moment too.
    types: [closed, reopened]

permissions:
  contents: read
  # WRITE for one call only (#4267): a completed close without a block puts the 'result-owed' label on the
  # issue (POST .../issues/<n>/labels), the one GitHub write the script makes. Otherwise it READS: the
  # script reads the issue's comments for the go-live block. It
  # reads them through REST (gh api .../issues/<n>/comments), which this scope covers; the GraphQL read
  # it replaced answered nothing on the runner (#2875). It reads the issue's events the same way, to
  # tell a block from before the last reopen from one for this round (#2968); the issue events endpoint
  # is covered by this scope, like the comments. Where a block comment's author reads as an
  # untrusted association -- a PRIVATE org member does, to this token -- it also reads that author's repo
  # permission (gh api .../collaborators/<login>/permission, #2907). GitHub's docs name no scope for that
  # endpoint, so whether this token may read it is measured on the first such run, not assumed: a refused
  # read is logged with gh's error, and the closed message goes out saying the result message follows (#3004).
  issues: write

# One group per issue, closes and reopens together, so their messages post in order and a running post
# is never killed half way. A group holds one running and one pending run, and a newer arrival drops the
# pending one, so a burst of three or more events on one issue posts fewer messages than events. That cap
# is accepted: the newest event, which is the issue's current state, is always the one still pending.
# The group orders runs as GitHub CREATED them, which is not always the order the events happened
# (xoxowildhearts#512: a reopen's run was created after the close's), so the script also reads the issue's
# current state and posts nothing for an event that state has superseded (#3995).
concurrency:
  group: asana-closed-message-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  closed-message:
    runs-on: ubuntu-latest
    # A job with no timeout-minutes runs to GitHub's six-hour default (#2296), holding ASANA_PAT.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job needs scripts/repo-config.ps1 (read as text) and nothing else from git, so the token
          # is not left in .git/config.
          persist-credentials: false

      # The script and the libs it loads (#4366), from the plugin's source repo at the release this file
      # was placed from (#4351). Pinned by SHA because the job holds ASANA_PAT; move the ref: line when the
      # plugin updates, and take the rest of this file from the template again where the session check
      # reports it differs.
      - name: Fetch the shared Asana scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DKJ-Solutions/dkj-marketplace
          ref: @@SCRIPTS_REF@@
          path: .workflow-scripts
          sparse-checkout: |
            plugins/dkj-repo-workflow/extensions/dkj-repo-workflow-bwj/scripts/ci
            plugins/dkj-repo-workflow/extensions/dkj-repo-workflow-bwj/scripts/lib
          persist-credentials: false

      - name: Tell the Asana task the issue is closed or reopened
        shell: pwsh
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_REF: ${{ github.repository }}#${{ github.event.issue.number }}
          ISSUE_EVENT: ${{ github.event.action }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          # The label names as a JSON array (a name may hold a comma); the script reads them from the
          # environment (#2902).
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The body is read from ISSUE_BODY by the script itself, not passed as an argument.
          & "$env:GITHUB_WORKSPACE/.workflow-scripts/plugins/dkj-repo-workflow/extensions/dkj-repo-workflow-bwj/scripts/ci/asana-closed-message.ps1" `
            -RepoConfigPath "$env:GITHUB_WORKSPACE/scripts/repo-config.ps1" `
            -IssueRef $env:ISSUE_REF `
            -Event $env:ISSUE_EVENT `
            -StateReason $env:STATE_REASON
