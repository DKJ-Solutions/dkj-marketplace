<!doctype html>
<!--
  A product's More page (#4125), the stylesheet-only reference: the page the bottom bar's More links to, beside
  product-bottom-bar.html. More is a destination like the other slots, so it has a URL, the phone's back gesture
  leaves it as it leaves any page, and the bar marks it current here. The page holds the site menu's own sections in
  a .menu-page: the pages the bar does not carry, the Settings row, and the app's name at the foot. With More a page,
  the header draws no menu dialog, since nothing opens it.

  Built from ../house-style.css, ../house-product.css and ../house-theme.js and nothing else (#3831). The rules are in
  the product README beside this folder, "The bottom bar". The icons are placeholders: an app draws its own.
-->

  <link rel="stylesheet" href="../house-style.css">
  <link rel="stylesheet" href="../house-product.css">
  <script src="../house-theme.js"></script>
</head>
<body>
